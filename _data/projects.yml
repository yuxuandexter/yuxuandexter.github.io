- id: fastafd
  name: "FastAFD — Attention–FFN Disaggregation for MoE Inference"
  role_label: "Co-lead"
  url: "https://haoailab.com/blogs/fastafd/"
  description: >-
    FastAFD separates KV-cache-constrained attention from MoE expert execution,
    aggregating tokens across attention workers to keep expert batches large.
    Its runtime overlaps communication, computation, and scheduling to make
    disaggregation effective on GB200 NVL72. On Qwen3-235B-A22B-FP8 and MiniMax-M2.5,
    it achieves **1.35–1.45× per-GPU steady-state decode throughput** over a tuned
    colocated vLLM baseline.
  links:
    - label: "Technical Blog"
      url: "https://haoailab.com/blogs/fastafd/"
    - label: "Code"
      url: "https://github.com/hao-ai-lab/FastAFD"

- id: gamingagent-grl
  name: "GamingAgent & GRL — Game-Based Evaluation and Multi-Turn RL"
  role_label: "GamingAgent: Co-lead · GRL: Lead"
  url: "https://github.com/lmgame-org/GamingAgent"
  description: >-
    GamingAgent combines standardized game environments with a modular
    perception–memory–reasoning harness, enabling comparisons between bare
    LLM/VLM policies and agentic workflows. GRL extends this ecosystem from
    evaluation to multi-turn reinforcement learning, with training backends
    built on VERL and Tunix.
  links:
    - label: "GamingAgent"
      url: "https://github.com/lmgame-org/GamingAgent"
    - label: "GRL"

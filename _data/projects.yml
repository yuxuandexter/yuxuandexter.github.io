      url: "https://arxiv.org/abs/2505.15146"
    - label: "Ace Attorney Demo"
      url: "https://x.com/haoailab/status/1912231343372812508"

- id: nanorollout
  name: "NanoRollout — Scaling Digital Agent RL and Distillation"
  role_label: "Equal contribution"
  url: "https://cocoa-org.notion.site/nanorollout"
  description: >-
    We use NanoRollout to study how rollout scale and training-data composition
    affect digital agents. In matched-recipe SWE-agent experiments, scaling
    rollout batches to **4,096** improves RL performance. Our distillation study
    also exposes a key failure mode: **single-harness training can perform worse
    than the base model under an unseen harness**. These findings motivate
    multi-harness trajectory mixtures, used to train **Mocha-Coder-32B**.
  links:
    - label: "Blog"
      url: "https://cocoa-org.notion.site/nanorollout"
    - label: "Code"
      url: "https://github.com/cocoa-org/NanoRollout"


- id: tunix
  name: "Zero-TIM in Tunix — Bitwise-Zero Train–Inference Mismatch on TPU"
  role_label: "Google internship · First author"
  url: "https://developers.googleblog.com/unlocking-stable-on-policy-rl-on-tpu-with-bitwise-zero-traininference-mismatch/"
  description: >-
    Batch-invariant Pallas kernels and ordered cross-shard reductions achieving
    bitwise-identical bfloat16 logprobs across 64 TPU v5p chips (62.7% → 88.2%
    FrozenLake solve rate); also implemented TPU sequence packing.
  links:
